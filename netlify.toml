[build]
# Bun is pre-installed in the Netlify build image, so the command below works
# even though Netlify only auto-detects the binary bun.lockb lockfile. This
# repo has no other lockfile (package-lock.json was removed in the rewrite),
# so Netlify will not fall back to npm. If a deploy log ever shows npm
# instead, add an empty bun.lockb file to trigger Bun auto-detection.
command = "bun install --frozen-lockfile && bun run build"
publish = "dist"

[dev]
command = "bun run dev"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

# Old multi-page URLs point at the matching section of the one page.
# These are redirects, not new pages.
[[redirects]]
from = "/projects"
to = "/#work"
status = 301

[[redirects]]
from = "/about"
to = "/#atelier"
status = 301

[[redirects]]
from = "/contact"
to = "/#contact"
status = 301

# Single-page fallback for any other path.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
