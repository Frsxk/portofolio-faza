<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">NimeNime Hub: update feed</title>
  <desc id="desc">Illustration of the NimeNime Hub update feed. New updates enter a post list, a reader opens a post, and the post links back to the feed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#82D5CA"/></marker>
  </defs>
  <rect width="800" height="500" fill="#0F1417"/>
  <g font-family="monospace" fill="#DFE3E7">
    <text x="36" y="44" font-size="15">PROJECT 01 / NIMENIME HUB</text>
    <text x="36" y="72" font-size="12" fill="#82D5CA">BLOG / HTML, CSS, JAVASCRIPT</text>
    <path d="M36 94H764" stroke="#262B2E" stroke-width="2"/>
    <g fill="#181C1F" stroke="#82D5CA" stroke-width="2">
      <rect x="36" y="164" width="142" height="106" rx="8"/>
      <rect x="228" y="164" width="150" height="106" rx="8"/>
      <rect x="428" y="164" width="142" height="106" rx="8"/>
      <rect x="620" y="164" width="144" height="106" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text text-anchor="middle" x="107" y="201">NEW UPDATE</text>
      <text text-anchor="middle" x="107" y="234" font-size="12" fill="#B6C8E3">anime and manga</text>
      <text text-anchor="middle" x="303" y="201">POST LIST</text>
      <text text-anchor="middle" x="303" y="234" font-size="12" fill="#B6C8E3">all updates</text>
      <text text-anchor="middle" x="499" y="201">POST</text>
      <text text-anchor="middle" x="499" y="234" font-size="12" fill="#B6C8E3">one update</text>
      <text text-anchor="middle" x="692" y="201">READER</text>
      <text text-anchor="middle" x="692" y="234" font-size="12" fill="#B6C8E3">reads and returns</text>
    </g>
    <g fill="none" stroke="#82D5CA" stroke-width="2" marker-end="url(#arrow)">
      <path d="M178 217H218"/>
      <path d="M378 217H418"/>
      <path d="M570 217H610"/>
    </g>
    <path d="M36 330H764" stroke="#262B2E" stroke-width="2"/>
    <text x="36" y="360" font-size="12" fill="#FDB96C">BOUNDARY RULE</text>
    <text x="36" y="388" font-size="13">One post, one update. The feed lists, the post explains.</text>
    <path d="M36 421H764" stroke="#262B2E" stroke-width="2"/>
    <text x="36" y="449" font-size="12" fill="#B6C8E3">Illustration, not a screenshot. The live site or bot is the real thing.</text>
  </g>
</svg>
