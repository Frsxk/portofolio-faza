<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Knight of the Night: game loop</title>
  <desc id="desc">Illustration of the Knight of the Night game loop. Input moves the knight, the scene updates the world, and the game renders the next frame.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#82D5CA"/></marker>
  </defs>
  <rect width="800" height="500" fill="#0F1417"/>
  <g font-family="monospace" fill="#DFE3E7">
    <text x="36" y="44" font-size="15">PROJECT 02 / KNIGHT OF THE NIGHT</text>
    <text x="36" y="72" font-size="12" fill="#82D5CA">GAME LOOP / PHASER 3</text>
    <path d="M36 94H764" stroke="#262B2E" stroke-width="2"/>
    <g fill="#181C1F" stroke="#82D5CA" stroke-width="2">
      <rect x="36" y="164" width="142" height="106" rx="8"/>
      <rect x="228" y="164" width="150" height="106" rx="8"/>
      <rect x="428" y="164" width="142" height="106" rx="8"/>
      <rect x="620" y="164" width="144" height="106" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text text-anchor="middle" x="107" y="201">INPUT</text>
      <text text-anchor="middle" x="107" y="234" font-size="12" fill="#B6C8E3">keyboard</text>
      <text text-anchor="middle" x="303" y="201">SCENE</text>
      <text text-anchor="middle" x="303" y="234" font-size="12" fill="#B6C8E3">holds the world</text>
      <text text-anchor="middle" x="499" y="201">WORLD</text>
      <text text-anchor="middle" x="499" y="234" font-size="12" fill="#B6C8E3">updates</text>
      <text text-anchor="middle" x="692" y="201">FRAME</text>
      <text text-anchor="middle" x="692" y="234" font-size="12" fill="#B6C8E3">renders</text>
    </g>
    <g fill="none" stroke="#82D5CA" stroke-width="2" marker-end="url(#arrow)">
      <path d="M178 217H218"/>
      <path d="M378 217H418"/>
      <path d="M570 217H610"/>
    </g>
    <path d="M36 330H764" stroke="#262B2E" stroke-width="2"/>
    <text x="36" y="360" font-size="12" fill="#FDB96C">BOUNDARY RULE</text>
    <text x="36" y="388" font-size="13">Read input. Update the world. Render the frame.</text>
    <path d="M36 421H764" stroke="#262B2E" stroke-width="2"/>
    <text x="36" y="449" font-size="12" fill="#B6C8E3">Illustration, not a screenshot. The live site or bot is the real thing.</text>
  </g>
</svg>
